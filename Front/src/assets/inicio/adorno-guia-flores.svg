<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="380" height="280" viewBox="0 0 380 280" fill="none">
  <!-- Guía (enredadera) con flores para la esquina superior izquierda de un bloque guinda.
       Corre por la orilla de arriba y baja por el costado; de ella cuelgan tallitos con flores.
       Para las otras esquinas se voltea con CSS (scale). -->
  <defs>
    <!-- Flor de cinco pétalos -->
    <g id="flor">
      <g fill="#f6eaee">
        <ellipse cx="0" cy="-8" rx="5.5" ry="8.5"/>
        <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" transform="rotate(288)"/>
      </g>
      <g stroke="#e3b9c6" stroke-width="1.2" stroke-linecap="round">
        <path d="M0 -3 V -11"/><path d="M0 -3 V -11" transform="rotate(72)"/><path d="M0 -3 V -11" transform="rotate(144)"/>
        <path d="M0 -3 V -11" transform="rotate(216)"/><path d="M0 -3 V -11" transform="rotate(288)"/>
      </g>
      <circle r="4.2" fill="#c9a24a"/>
      <circle r="1.8" fill="#f2e3b8"/>
    </g>
    <!-- Flor dorada (variante) -->
    <g id="flor-dorada">
      <g fill="#f2e3b8">
        <ellipse cx="0" cy="-7" rx="4.6" ry="7.5"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7.5" transform="rotate(288)"/>
      </g>
      <circle r="3.6" fill="#9b2247"/>
      <circle r="1.5" fill="#e6d194"/>
    </g>
    <!-- Botón (flor cerrada) -->
    <g id="boton">
      <path d="M0 0 C -5 -4, -5 -12, 0 -16 C 5 -12, 5 -4, 0 0 Z" fill="#f6eaee"/>
      <path d="M0 0 C -4 -2, -6 -6, -6 -9 M0 0 C 4 -2, 6 -6, 6 -9" stroke="#8fbfae" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- Hoja con nervadura -->
    <g id="hoja">
      <path d="M0 0 C 6 -8, 18 -9, 28 0 C 18 9, 6 8, 0 0 Z" fill="#8fbfae" fill-opacity=".85"/>
      <path d="M2 0 H 24" stroke="#5f9887" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <g id="hoja-dorada">
      <path d="M0 0 C 6 -7, 16 -8, 24 0 C 16 8, 6 7, 0 0 Z" fill="#e6d194" fill-opacity=".7"/>
      <path d="M2 0 H 20" stroke="#c9a24a" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Tallos: guía principal por arriba y otra que baja por el costado -->
  <g stroke="#e6d194" stroke-opacity=".8" stroke-width="2.6" stroke-linecap="round">
    <path d="M0 12 C 50 36, 96 8, 150 26 S 250 44, 300 22 S 350 14, 372 30"/>
    <path d="M12 0 C 30 50, 6 96, 24 150 S 18 222, 34 272"/>
  </g>
  <!-- Zarcillos en espiral -->
  <g stroke="#e6d194" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round">
    <path d="M200 36 C 206 50, 222 50, 222 40 C 222 32, 212 32, 212 39"/>
    <path d="M340 18 C 346 6, 360 6, 360 14 C 360 21, 350 21, 351 15"/>
    <path d="M22 196 C 36 200, 40 214, 31 218 C 24 221, 21 213, 27 211"/>
  </g>
  <!-- Tallitos que cuelgan -->
  <g stroke="#e6d194" stroke-opacity=".7" stroke-width="1.8" stroke-linecap="round">
    <path d="M94 24 C 96 44, 92 60, 96 78"/>
    <path d="M176 30 C 178 48, 174 62, 178 74"/>
    <path d="M262 36 C 262 52, 258 64, 262 80"/>
    <path d="M18 104 C 32 110, 42 120, 50 134"/>
  </g>

  <!-- Hojas a lo largo de las guías -->
  <use href="#hoja" xlink:href="#hoja" transform="translate(40 26) rotate(30)"/>
  <use href="#hoja-dorada" xlink:href="#hoja-dorada" transform="translate(62 28) rotate(-40)"/>
  <use href="#hoja" xlink:href="#hoja" transform="translate(126 18) rotate(-30)"/>
  <use href="#hoja" xlink:href="#hoja" transform="translate(140 26) rotate(40)"/>
  <use href="#hoja-dorada" xlink:href="#hoja-dorada" transform="translate(218 36) rotate(-50)"/>
  <use href="#hoja" xlink:href="#hoja" transform="translate(236 38) rotate(30)"/>
  <use href="#hoja" xlink:href="#hoja" transform="translate(300 22) rotate(-40)"/>
  <use href="#hoja-dorada" xlink:href="#hoja-dorada" transform="translate(320 18) rotate(24)"/>
  <use href="#hoja" xlink:href="#hoja" transform="translate(20 40) rotate(20)"/>
  <use href="#hoja-dorada" xlink:href="#hoja-dorada" transform="translate(16 70) rotate(150)"/>
  <use href="#hoja" xlink:href="#hoja" transform="translate(20 130) rotate(30)"/>
  <use href="#hoja" xlink:href="#hoja" transform="translate(22 168) rotate(160)"/>
  <use href="#hoja-dorada" xlink:href="#hoja-dorada" transform="translate(26 236) rotate(20)"/>
  <use href="#hoja" xlink:href="#hoja" transform="translate(30 254) rotate(150)"/>
  <!-- Hojitas en los tallos que cuelgan -->
  <use href="#hoja-dorada" xlink:href="#hoja-dorada" transform="translate(95 50) rotate(-20) scale(.7)"/>
  <use href="#hoja-dorada" xlink:href="#hoja-dorada" transform="translate(177 52) rotate(200) scale(.7)"/>
  <use href="#hoja-dorada" xlink:href="#hoja-dorada" transform="translate(261 56) rotate(-20) scale(.7)"/>

  <!-- Flores -->
  <use href="#flor" xlink:href="#flor" transform="translate(96 88)"/>
  <use href="#flor-dorada" xlink:href="#flor-dorada" transform="translate(178 82) scale(.9)"/>
  <use href="#flor" xlink:href="#flor" transform="translate(262 90) scale(.95)"/>
  <use href="#flor" xlink:href="#flor" transform="translate(16 16) scale(1.25)"/>
  <use href="#flor-dorada" xlink:href="#flor-dorada" transform="translate(54 142)"/>
  <use href="#flor" xlink:href="#flor" transform="translate(30 210) scale(.85) rotate(20)"/>
  <use href="#flor-dorada" xlink:href="#flor-dorada" transform="translate(150 26) scale(.8)"/>
  <use href="#flor" xlink:href="#flor" transform="translate(372 30) scale(.8)"/>
  <!-- Botones -->
  <use href="#boton" xlink:href="#boton" transform="translate(66 30) rotate(160)"/>
  <use href="#boton" xlink:href="#boton" transform="translate(222 40) rotate(200) scale(.85)"/>
  <use href="#boton" xlink:href="#boton" transform="translate(16 96) rotate(110) scale(.9)"/>
  <use href="#boton" xlink:href="#boton" transform="translate(34 272) rotate(190) scale(.85)"/>
</svg>

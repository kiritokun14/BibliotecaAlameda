<svg xmlns="http://www.w3.org/2000/svg" width="180" height="300" viewBox="0 0 180 300" fill="none">
  <!-- Tallo con flores que crece desde abajo (adorno de los costados): dos flores de cinco pétalos, un botón y hojas. -->
  <defs>
    <g id="pf"><ellipse cx="0" cy="-11" rx="7.5" ry="11.5"/></g>
  </defs>
  <g stroke="#1f6b5c" stroke-width="3" stroke-linecap="round">
    <path d="M70 300 C 66 240, 74 180, 96 120 C 108 88, 112 60, 110 34"/>
    <path d="M84 178 C 64 160, 46 150, 28 148"/>
    <path d="M92 140 C 112 128, 130 124, 148 126"/>
  </g>
  <g fill="#2a7d6b" fill-opacity=".9">
    <path d="M72 250 C 48 246, 32 232, 28 214 C 50 218, 66 230, 72 250 Z"/>
    <path d="M76 228 C 98 218, 118 222, 128 236 C 108 244, 88 242, 76 228 Z"/>
    <path d="M86 196 C 66 186, 56 170, 58 154 C 76 162, 86 178, 86 196 Z"/>
    <path d="M102 104 C 122 94, 140 98, 148 110 C 130 118, 112 116, 102 104 Z"/>
  </g>
  <g stroke="#164f44" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round">
    <path d="M72 250 C 58 238, 44 226, 32 216"/><path d="M76 228 C 94 230, 110 232, 124 235"/><path d="M102 104 C 118 106, 132 108, 144 110"/>
  </g>
  <!-- Flor grande (arriba) -->
  <g transform="translate(110 30)">
    <g fill="#f2e3b8"><use href="#pf"/><use href="#pf" transform="rotate(72)"/><use href="#pf" transform="rotate(144)"/><use href="#pf" transform="rotate(216)"/><use href="#pf" transform="rotate(288)"/></g>
    <circle r="6.5" fill="#c9a24a"/><circle r="2.6" fill="#9b2247"/>
  </g>
  <!-- Flor rosa (rama izquierda) -->
  <g transform="translate(26 146) scale(.75)">
    <g fill="#f6eaee"><use href="#pf"/><use href="#pf" transform="rotate(72)"/><use href="#pf" transform="rotate(144)"/><use href="#pf" transform="rotate(216)"/><use href="#pf" transform="rotate(288)"/></g>
    <circle r="6" fill="#c9a24a"/>
  </g>
  <!-- Botón (rama derecha) -->
  <path d="M150 126 C 144 118, 146 106, 154 100 C 162 106, 162 118, 156 126 Z" fill="#e6d194"/>
  <path d="M150 126 C 152 122, 154 122, 156 126" stroke="#1f6b5c" stroke-width="2" stroke-linecap="round"/>
</svg>
